<div class="card-container">
  <mat-card 
    class="example-card" 
    appearance="outlined" 
    *ngFor="let card of cards"
  >
    <mat-card-header>
      <div mat-card-avatar class="example-header-image"></div>
      <mat-card-title>{{ card.title }}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <p>{{ card.description }}</p>
    </mat-card-content>
    <mat-card-actions>
      <button mat-button (click)="openDialog(card)">Upload</button>
      <button mat-button>SHARE</button>
    </mat-card-actions>
  </mat-card>
</div>
